name: 📘 Documentation
description: Something on the documentation site is wrong, missing or unclear.
title: 'docs: '
labels: ['documentation']
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Please write the issue in English so everyone can follow it.

        Small fixes are very welcome as a pull request instead — every page has an **Edit this page** link at the bottom that takes you straight to the file.

  - type: input
    id: page
    attributes:
      label: Which page
      description: The URL, or the path under `docs/`.
      placeholder: 'https://mawy.cdget.com/guide/getting-started'
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Which language
      multiple: true
      options:
        - English (docs/en)
        - Korean (docs/ko)
        - Both
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What the page says, and what it should say. If the two languages disagree with each other, say which one you believe.
    validations:
      required: true
