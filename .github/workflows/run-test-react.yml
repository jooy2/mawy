name: run-test-react

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/react/**
      - .github/workflows/run-test-react.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: ./packages/react

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and typecheck

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npx prettier . --check
      - name: Typecheck
        run: npm run typecheck
      # The only step that builds `dist/` the way `npm publish` would, so a
      # change that compiles in the editor but not through `tsconfig.prod.json`
      # fails here rather than in a release.
      - name: Build
        run: npm run build
      # What a consumer's bundle actually gains, against a recorded ceiling. It
      # runs here rather than in its own job because it needs `dist/`, which the
      # step above is the only one that makes.
      - name: Size
        run: npm run size

  run-test-react:
    runs-on: ${{ matrix.os }}
    name: Test Node.js ${{ matrix.node_version }} on ${{ matrix.os }} (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        node_version: ['26']
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js ${{ matrix.node_version }}
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - run: npm ci
      # The suite runs in a real browser rather than a DOM emulator: selection,
      # ranges, `beforeinput` and `contenteditable` are what this library is
      # made of, and jsdom implements none of them faithfully enough for a
      # passing test to mean anything.
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test module script
        run: npm run test
        env:
          VITEST_BROWSER: ${{ matrix.browser }}
